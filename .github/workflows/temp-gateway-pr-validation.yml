name: Temporary gateway PR validation

on:
  push:
    branches:
      - fix/gateway-unavailable-startup-retry

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[normalize-crlf]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore upstream metadata and CRLF line endings
        run: |
          python - <<'PY'
          from pathlib import Path

          init = Path('custom_components/linktap/__init__.py')
          text = init.read_text()
          marker = 'MAX_PLAUSIBLE_SESSION_VOLUME = 10_000.0\n'
          schema = 'CONFIG_SCHEMA = cv.config_entry_only_config_schema(DOMAIN)\n'
          if schema not in text:
              text = text.replace(marker, marker + schema, 1)
          init.write_bytes(text.replace('\r\n', '\n').replace('\n', '\r\n').encode())

          tests = Path('tests/test_init.py')
          text = tests.read_text()
          tests.write_bytes(text.replace('\r\n', '\n').replace('\n', '\r\n').encode())
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Commit normalized branch files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/linktap/__init__.py tests/test_init.py
          git diff --cached --quiet && exit 0
          git commit -m 'chore: preserve upstream line endings [normalize-crlf]'
          git push

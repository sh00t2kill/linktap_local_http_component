name: Finalize Release

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  finalize:
    name: Tag and release merged version bump
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Extract release metadata from PR body
        id: meta
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          tag=$(printf '%s\n' "$PR_BODY" | grep -oP '(?<=<!-- release-tag: )[^ ]+(?= -->)' | head -n 1)
          create_release=$(printf '%s\n' "$PR_BODY" | grep -oP '(?<=<!-- create-release: )[^ ]+(?= -->)' | head -n 1)

          if [ -z "$tag" ]; then
            echo "Could not find release-tag marker in PR body" >&2
            exit 1
          fi

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "create_release=$create_release" >> "$GITHUB_OUTPUT"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          git tag "${{ steps.meta.outputs.tag }}"
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Create GitHub release
        if: ${{ steps.meta.outputs.create_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "${{ steps.meta.outputs.tag }}" \
            --generate-notes
